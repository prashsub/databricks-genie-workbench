targets:
  vc-sandbox:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    # The vc jobs run_as dedicated SPs (separation of duties). Those SPs must be
    # able to read the wheel artifacts under the deployer's bundle folder, so
    # grant them CAN_MANAGE on the deployment (root folder + jobs); workspace ACL
    # inheritance covers artifacts/.internal/*.whl. Without this, serverless
    # library install fails with "library file does not exist or ... permission".
    permissions:
      - service_principal_name: ${var.vc_provisioner_principal}
        level: CAN_MANAGE
      - service_principal_name: ${var.vc_executor_principal}
        level: CAN_MANAGE
      - service_principal_name: ${var.vc_enrollment_principal}
        level: CAN_MANAGE
    # Build hook only (mirrors root artifacts.default for the GSO wheel): the
    # genie_workbench wheel lands in .build/, which is synced (root sync
    # include) and referenced by each job environment's relative dependency
    # path. A `type: whl` artifact here globs dist/ and fails on deploy.
    artifacts:
      vc_platform:
        build: uv build --wheel --out-dir .build
    resources:
      jobs:
        vc-restore: &vc_job
          name: ${var.app_name}-vc-restore
          max_concurrent_runs: 1
          queue:
            enabled: true
          run_as:
            service_principal_name: ${var.vc_executor_principal}
          parameters:
            - name: operation_id
              default: ""
          tasks:
            - &vc_task
              task_key: execute
              environment_key: default
              max_retries: 0
              retry_on_timeout: false
              timeout_seconds: 3600
              python_wheel_task:
                package_name: genie_workbench
                entry_point: vc-platform
                parameters: [--kind, restore, --operation-id, "{{job.parameters.operation_id}}"]
          environments:
            - environment_key: default
              spec:
                environment_version: "4"
                dependencies:
                  - ../../.build/genie_workbench-0.1.0-py3-none-any.whl
                  - ../../.build/genie_space_optimizer-0.0.0-py3-none-any.whl
        vc-reconcile:
          <<: *vc_job
          name: ${var.app_name}-vc-reconcile
          tasks:
            - <<: *vc_task
              python_wheel_task:
                package_name: genie_workbench
                entry_point: vc-platform
                parameters: [--kind, reconcile, --operation-id, "{{job.parameters.operation_id}}"]
        vc-promotion:
          <<: *vc_job
          name: ${var.app_name}-vc-promotion
          tasks:
            - <<: *vc_task
              python_wheel_task:
                package_name: genie_workbench
                entry_point: vc-platform
                # The reviewed governed target config (roles, selections, volumes,
                # topology, source binding, flags) is too large for inline CLI
                # parameters and is authored during provisioning; the Job loads it
                # from an immutable UC Volume URI. Absence leaves promotion
                # fail-closed ("not integrated").
                parameters:
                  - --kind
                  - promotion
                  - --operation-id
                  - "{{job.parameters.operation_id}}"
                  - --governed-config
                  - ${var.vc_governed_config_uri}
        vc-polling:
          <<: *vc_job
          name: ${var.app_name}-vc-polling
          tasks:
            - <<: *vc_task
              python_wheel_task:
                package_name: genie_workbench
                entry_point: vc-platform
                parameters: [--kind, polling, --operation-id, "{{job.parameters.operation_id}}"]
        vc-optimizer_apply:
          <<: *vc_job
          name: ${var.app_name}-vc-optimizer-apply
          tasks:
            - <<: *vc_task
              python_wheel_task:
                package_name: genie_workbench
                entry_point: vc-platform
                parameters: [--kind, optimizer_apply, --operation-id, "{{job.parameters.operation_id}}"]
        vc-enrollment:
          <<: *vc_job
          name: ${var.app_name}-vc-enrollment
          run_as:
            service_principal_name: ${var.vc_enrollment_principal}
          tasks:
            - <<: *vc_task
              python_wheel_task:
                package_name: genie_workbench
                entry_point: vc-platform
                parameters: [--kind, enrollment, --operation-id, "{{job.parameters.operation_id}}"]
        vc-recovery:
          <<: *vc_job
          name: ${var.app_name}-vc-recovery
          tasks:
            - <<: *vc_task
              python_wheel_task:
                package_name: genie_workbench
                entry_point: vc-platform
                parameters: [--kind, recovery, --operation-id, "{{job.parameters.operation_id}}"]
        vc-verification:
          <<: *vc_job
          name: ${var.app_name}-vc-verification
          tasks:
            - <<: *vc_task
              max_retries: 2
              python_wheel_task:
                package_name: genie_workbench
                entry_point: vc-platform
                parameters: [--kind, verification, --operation-id, "{{job.parameters.operation_id}}"]
        vc-provision:
          <<: *vc_job
          name: ${var.app_name}-vc-provision
          run_as:
            service_principal_name: ${var.vc_provisioner_principal}
          tasks:
            - <<: *vc_task
              python_wheel_task:
                package_name: genie_workbench
                entry_point: vc-platform
                # Provisioning precedes the durable fact tables, so its explicit
                # target config is passed from reviewed bundle variables (not a
                # durable request). Owner migrations + the least-privilege grant
                # matrix run as the provisioner SP.
                parameters:
                  - --kind
                  - provision
                  - --operation-id
                  - "{{job.parameters.operation_id}}"
                  - --catalog
                  - ${var.catalog}
                  - --control-schema
                  - ${var.control_schema}
                  - --warehouse-id
                  - ${var.warehouse_id}
                  - --runtime-principal
                  - ${var.vc_runtime_principal}
                  - --executor-principal
                  - ${var.vc_executor_principal}
                  - --enrollment-principal
                  - ${var.vc_enrollment_principal}
                  - --observer-principal
                  - ${var.vc_observer_principal}
                  - --approval-principal
                  - ${var.vc_approval_principal}
                  - --source-principal
                  - ${var.vc_source_principal}
